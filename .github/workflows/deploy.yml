name: Deploy Full App (Worker + Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------
      # FRONTEND BUILD
      # -------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Detect frontend build output
        run: |
          echo "=== frontend root ==="
          ls -la frontend

          echo "=== candidate build dirs ==="
          for dir in build dist out .output/public; do
            if [ -d "frontend/$dir" ]; then
              echo "FOUND BUILD DIR: frontend/$dir"
            fi
          done

          echo "=== full frontend tree (depth 2) ==="
          find frontend -maxdepth 2 -type d

      # -------------------------
      # WORKER INSTALL
      # -------------------------
      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      # -------------------------
      # DEPLOY
      # -------------------------
      - name: Deploy Worker + Assets
        working-directory: worker
        run: npx wrangler deploy
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
