name: Deploy Full App (Worker + Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build
          # Ensure the build folder exists for Wrangler
          ls -la build  # check build contents

      - name: Install worker dependencies
        run: |
          cd worker
          npm install

      - name: Verify frontend build
        run: ls -la frontend/build

      - name: Deploy to Cloudflare Worker with static assets
        run: npx wrangler deploy
        working-directory: .
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
