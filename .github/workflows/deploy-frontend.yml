name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install  # Generates package-lock.json automatically if missing

      - name: Build
        run: |
          cd frontend
          npm run build  # Creates frontend/build folder with static files

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: explainmybill  # Confirm this EXACTLY matches your Pages project name in dashboard
          directory: frontend/build  # CRA outputs to build/, then we deploy that
