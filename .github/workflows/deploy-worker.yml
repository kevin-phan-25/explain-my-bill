name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}      # Required — use your template token
          accountId: ${{ secrets.CF_ACCOUNT_ID }}    # Highly recommended
          workingDirectory: worker
          packageManager: npm
