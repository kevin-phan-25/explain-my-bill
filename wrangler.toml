name = "explain-my-bill"
main = "worker/src/index.js"
compatibility_date = "2025-12-30"  # Always keep this current or today's date

# Critical for proper file upload handling (File objects instead of corrupted strings)
compatibility_flags = ["formdata_parser_supports_files"]

# Optional: Remove nodejs_compat unless you're using Node-specific globals like Buffer, process, etc.
# If you keep it and have bundle size issues, you can remove it — your code likely doesn't need it.

# Keep observability for great debugging in the Cloudflare dashboard
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# No build command needed for plain Workers
[build]
command = ""
