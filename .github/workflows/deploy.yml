name: Deploy Full App (Worker + Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3) Build frontend
      - name: Install and build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Verify frontend build output
        run: |
          echo "Listing frontend folder:"
          ls -la frontend
          echo "Listing frontend dist:"
          ls -la frontend/dist || echo "No dist folder found"

      # 4) Install worker dependencies
      - name: Install worker dependencies
        run: |
          cd worker
          npm install

      # 5) Deploy to Cloudflare Worker
      - name: Deploy to Cloudflare
        run: |
          npx wrangler deploy
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
