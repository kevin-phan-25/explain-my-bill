name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'              # Only run if files in worker/ change
      - '.github/workflows/deploy-worker.yml'  # Optional: re-run if workflow changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy src/index.js
          packageManager: npm
